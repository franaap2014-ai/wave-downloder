name: Expandir o código-fonte do Wave Downloder
on:
  push:
    branches: [main]
    paths: ['source.tar.xz']
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair código da versão inicial
        run: |
          if [ ! -f source.tar.xz ]; then exit 0; fi
          tar -xJf source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py Dockerfile render.yaml requirements.txt templates static
          if ! git diff --cached --quiet; then
            git commit -m "Expande arquivos-fonte do Wave Downloder"
            git push origin HEAD:main
          fi
