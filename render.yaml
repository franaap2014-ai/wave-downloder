services:
  - type: web
    name: wave-downloder
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ACCESS_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
